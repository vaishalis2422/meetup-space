
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Room | MeetSpace</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #100b1c;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 8%;
            border-bottom: 1px solid #302442;
        }

        .logo {
            color: #c4a3ff;
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: #d8d0e8;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            color: #c4a3ff;
        }

        .container {
            max-width: 850px;
            margin: 55px auto;
            padding: 0 22px;
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .heading h1 span {
            color: #bd94ff;
        }

        .heading p {
            color: #b9aecb;
            line-height: 1.6;
        }

        .form-card {
            background: #1b1329;
            border: 1px solid #382849;
            border-radius: 20px;
            padding: 32px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            color: #e4d9f5;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #49345f;
            background: #120c1e;
            color: white;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #b58aff;
        }

        select option {
            background: #1b1329;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #a875f5;
            color: #160d27;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c4a3ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 13px;
            border-radius: 9px;
            display: none;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            background: #163729;
            color: #8ff0b6;
        }

        .error {
            display: block !important;
            background: #421d2a;
            color: #ffb4c0;
        }

        .hint {
            color: #a99bbd;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 650px) {
            nav {
                flex-direction: column;
                gap: 18px;
            }

            nav a {
                margin: 0 5px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .form-card {
                padding: 22px;
            }

            .heading h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">✦ MeetSpace</div>
        <div>
            <a href="index.html">Home</a>
            <a href="book.html">Book a Room</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="bookings.html">My Bookings</a>
        </div>
    </nav>

    <main class="container">
        <div class="heading">
            <h1>Book your <span>space.</span></h1>
            <p>Choose a meeting room and reserve your preferred time slot.</p>
        </div>

        <form class="form-card" id="bookingForm">
            <div class="form-grid">

                <div class="field full">
                    <label for="name">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                        maxlength="100"
                    >
                </div>

                <div class="field full">
                    <label for="room">Meeting Room</label>
                    <select id="room" required>
                        <option value="">Select a room</option>
                        <option>Conference Room A</option>
                        <option>Conference Room B</option>
                        <option>Meeting Room C</option>
                        <option>Meeting Room D</option>
                        <option>Training Room E</option>
                        <option>Discussion Room F</option>
                        <option>Interview Room G</option>
                        <option>Board Room H</option>
                        <option>Creative Room I</option>
                        <option>Project Room J</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="date">Booking Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="field">
                    <label for="startTime">Start Time</label>
                    <select id="startTime" required>
    <option value="">Select start time</option>
</select>
                </div>

                <div class="field">
                    <label for="endTime">End Time</label>
                    <select id="endTime" required>
    <option value="">Select end time</option>
</select>
                </div>

                <div class="field full">
                    <p class="hint">
                        Availability is checked when you submit your booking.
                        Make sure the end time is later than the start time.
                    </p>
                </div>

                <div class="field full">
                    <button type="submit" id="bookButton">
                        Confirm Booking →
                    </button>
                </div>
            </div>

            <div id="message" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script>
        const API = 'http://localhost:3000';

        const form = document.getElementById('bookingForm');
        const message = document.getElementById('message');
        const bookButton = document.getElementById('bookButton');
        const dateInput = document.getElementById('date');

        // Prevent selecting a past date
        const today = new Date();
        const localDate = [
            today.getFullYear(),
            String(today.getMonth() + 1).padStart(2, '0'),
            String(today.getDate()).padStart(2, '0')
        ].join('-');

        dateInput.min = localDate;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }
function addTimeOptions(id) {
    const select = document.getElementById(id);

    for (let hour = 8; hour <= 20; hour++) {
        for (let minute = 0; minute < 60; minute += 30) {
            if (hour === 20 && minute > 0) continue;

            const h = String(hour).padStart(2, '0');
            const m = String(minute).padStart(2, '0');
            const value = `${h}:${m}`;

            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        }
    }
}

addTimeOptions('startTime');
addTimeOptions('endTime');
        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const room = document.getElementById('room').value;
            const date = dateInput.value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (!name) {
                showMessage('Please enter your name.', 'error');
                return;
            }

            if (endTime <= startTime) {
                showMessage('End time must be later than start time.', 'error');
                return;
            }

            bookButton.disabled = true;
            bookButton.textContent = 'Booking...';
            message.className = '';

            try {
                const response = await fetch(`${API}/bookings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        room,
                        date,
                        startTime,
                        endTime
                    })
                });

                const text = await response.text();

let data;
try {
    data = JSON.parse(text);
} catch {
    throw new Error(text || 'Something went wrong.');
}

                if (!response.ok) {
                    throw new Error(
                        data.message || data.error ||
                        'Booking failed. Please try again.'
                    );
                }

                showMessage(
                    data.message || 'Booking successful!',
                    'success'
                );

                form.reset();
                dateInput.min = localDate;

            } catch (error) {
                showMessage(
                    error.message === 'Failed to fetch'
                        ? 'Cannot connect to the server. Make sure your backend is running.'
                        : error.message,
                    'error'
                );
            } finally {
                bookButton.disabled = false;
                bookButton.textContent = 'Confirm Booking →';
            }
        });
    </script>

</body>
</html>
